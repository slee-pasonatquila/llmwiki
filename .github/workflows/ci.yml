name: LLM Wiki CI / CD

on:
  push:
    branches: [ main ]
    paths:
      - 'wiki/**'
      - 'scripts/**'
      - '.agents/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'wiki/**'
      - 'scripts/**'
      - '.agents/**'

jobs:
  validate-wiki:
    name: Validate OKF v0.2 & Multi-User Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run OKF v0.2 & Multi-User Linter
        run: |
          python3 scripts/lint_okf.py wiki/

      - name: Dry-run Synchronization
        run: |
          python3 scripts/sync_wiki.py

  auto-sync:
    name: Auto-Synchronize Wiki on Main Merge
    needs: validate-wiki
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild Indexes, Changelogs & Knowledge Graph
        run: |
          python3 scripts/sync_wiki.py

      - name: Commit & Push Updated Artifacts
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action (Wiki Sync Bot)"
          git add wiki/index.md wiki/*/index.md wiki/log.md wiki/graph.json wiki/graph.mermaid
          if git diff --staged --quiet; then
            echo "No artifact changes to commit."
          else
            git commit -m "chore(wiki): auto-synchronize indexes, changelog & knowledge graph [skip ci]"
            git push
          fi
